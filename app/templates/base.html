<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网关测量帧解码</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1c2430; }
    header { background: #1f3a5f; color: #fff; padding: 1rem 1.5rem; }
    header h1 { margin: 0; font-size: 1.2rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    section { background: #fff; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem;
              box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    h2 { font-size: 1rem; margin: 0 0 .75rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #e3e7ec; }
    th { background: #f0f3f7; font-weight: 600; }
    .flash { padding: .65rem .9rem; border-radius: 6px; margin-bottom: .75rem; font-size: .9rem; }
    .flash.success { background: #e4f6ea; color: #14532d; }
    .flash.error { background: #fde8e8; color: #7f1d1d; }
    .flash.info { background: #e8f0fe; color: #1e3a8a; }
    form.inline { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    input[type=text], input[type=file], select { padding: .4rem .5rem; border: 1px solid #c4ccd6;
              border-radius: 4px; font-size: .9rem; }
    button { padding: .45rem .9rem; border: 0; border-radius: 4px; background: #1f3a5f; color: #fff;
             font-size: .9rem; cursor: pointer; }
    .badge { display: inline-block; padding: .1rem .45rem; border-radius: 10px; font-size: .8rem; }
    .badge.decoded { background: #dcfce7; color: #166534; }
    .badge.invalid { background: #fee2e2; color: #991b1b; }
    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.reused { background: #e0e7ff; color: #3730a3; }
    .mono { font-family: ui-monospace, monospace; }
    .muted { color: #667085; font-size: .82rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e5e7eb; }
      section { background: #1f2937; }
      th { background: #374151; }
      th, td { border-bottom-color: #374151; }
      input, select { background: #111827; color: #e5e7eb; border-color: #4b5563; }
    }
  </style>
</head>
<body>
<header><h1><a href="{{ url_for('main.index') }}" style="color:#fff;text-decoration:none">网关测量帧解码</a></h1></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
