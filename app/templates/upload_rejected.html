{% extends "base.html" %}
{% block content %}
<section>
  <h2>上传被拒绝</h2>
  <p class="flash error">{{ message }}</p>
  <p class="muted">整批未写入，数据库保持上传前状态。</p>
  <table>
    <thead><tr><th>设备号</th><th>帧号</th><th>已存原始字</th><th>本次原始字</th></tr></thead>
    <tbody>
    {% for c in conflicts %}
      <tr>
        <td>{{ c.device_id }}</td>
        <td>{{ c.frame_no }}</td>
        <td class="mono">{{ c.stored_raw_word }}</td>
        <td class="mono">{{ c.uploaded_raw_word }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <p><a href="{{ url_for('main.index') }}">返回首页</a></p>
</section>
{% endblock %}
